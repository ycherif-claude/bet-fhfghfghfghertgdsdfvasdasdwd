<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Giocate del giorno</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&display=swap">
  <link rel="stylesheet" href="stile.css">
</head>
<body>
  <header class="testata">
    <nav><a href="index.html" aria-current="page">Oggi</a><a href="storico.html">Storico</a></nav>
    <h1 id="data-giornata">Giocate del giorno</h1>
    <p class="data" id="aggiornamento"></p>
  </header>
  <main>
    <div id="riquadro"></div>
    <section id="coppie-quota2" class="giocate" aria-label="Coppie a quota 2"></section>
    <section id="multiple-probabili" class="giocate" aria-label="Multiple con le partite più probabili"></section>
    <!-- Tutto il resto [utente, 29/10/2026]: calcolato e registrato come prima, ma chiuso finché non lo si apre. -->
    <details class="altro" id="altro">
      <summary>Tutto il resto (avvisi, giocate, pronostici, doppie e triple, altre multiple)</summary>
      <div id="avvisi"></div>
      <section id="pronostici" class="giocate" aria-label="Pronostici di oggi"></section>
      <section id="schedine-pronostici" class="giocate" aria-label="Doppie e triple"></section>
      <div id="filtri" class="filtri" role="group" aria-label="Filtro per sport"></div>
      <div id="giocate" class="giocate"><p class="vuoto">Caricamento…</p></div>
      <section id="multiple-bonus" class="giocate" aria-label="Multiple bonus bet365"></section>
    </details>
    <details class="impostazioni">
      <summary>Impostazioni</summary>
      <form id="impostazioni">
        <label for="imp-repo">Repository (utente/nome)</label>
        <input id="imp-repo" type="text" autocomplete="off" placeholder="utente/nome">
        <label for="imp-token">Codice segreto (token GitHub con permesso Contents lettura/scrittura solo su questo repository)</label>
        <input id="imp-token" type="password" autocomplete="off">
        <button type="submit" class="primario">Salva</button>
        <button type="button" id="imp-cancella-token" class="secondario">Cancella codice</button>
        <p id="imp-stato" role="status"></p>
      </form>
    </details>
  </main>
  <script type="module" src="app.js"></script>
</body>
</html>
