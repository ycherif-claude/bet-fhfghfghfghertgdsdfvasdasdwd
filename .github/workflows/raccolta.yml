name: Raccolta dati calcio

on:
  schedule:
    - cron: '35 5 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: dati

jobs:
  raccolta:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm test
      - run: npm run raccolta
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          FOOTBALL_DATA_ORG_KEY: ${{ secrets.FOOTBALL_DATA_ORG_KEY }}
      - name: Salva i dati
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898799+github-actions[bot]@users.noreply.github.com"
          git add data/
          if [ -n "$(git status --porcelain data/)" ]; then
            git commit -m "Raccolta $(TZ=Europe/Rome date +%F)"
            git pull --rebase
            git push
          fi
      - name: Avvia la pubblicazione del sito
        run: gh workflow run pubblica.yml
        env:
          GH_TOKEN: ${{ github.token }}
