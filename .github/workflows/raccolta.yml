name: Raccolta dati calcio

on:
  schedule:
    - cron: '35 5 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: dati

jobs:
  raccolta:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm test
      - name: Elo europeo (coppe)
        # Storico delle coppe e punteggi di tutti i club: servono alla raccolta per Champions, Europa e Conference League.
        run: npm run elo-europeo
        continue-on-error: true
      - name: Quote del calcio (odss-api)
        # Fonte principale delle quote del calcio (tutte le competizioni) e quote dei bookmaker italiani dell'utente:
        # 1x2, doppia chance e under/over della giornata in data/raccolta/<data>-odss.json, che la raccolta del calcio
        # (step dopo, senza chiave odss) e il giro del mattino (routine Claude, senza secrets) leggono da soli.
        # Budget unico odss in data/stato/odss.json: calcio al massimo 6 richieste, 10 al giorno fra tutti gli sport,
        # mai sotto 60 rimaste. Senza quote odss la raccolta del calcio torna a The Odds API.
        run: npm run raccolta-odss
        continue-on-error: true
        env:
          ODSS_API_KEY: ${{ secrets.ODSS_API_KEY }}
      - run: npm run raccolta
        continue-on-error: true
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          FOOTBALL_DATA_ORG_KEY: ${{ secrets.FOOTBALL_DATA_ORG_KEY }}
      - name: Raccolta NBA
        # Partite e quote da odss-api (1 richiesta, solo da ottobre a giugno); senza odss, SportsGameOdds.
        run: npm run raccolta-nba
        continue-on-error: true
        env:
          BALLDONTLIE_API_KEY: ${{ secrets.BALLDONTLIE_API_KEY }}
          SPORTSGAMEODDS_API_KEY: ${{ secrets.SPORTSGAMEODDS_API_KEY }}
          ODSS_API_KEY: ${{ secrets.ODSS_API_KEY }}
      - name: Raccolta tennis
        # Quote da odss-api (1 richiesta, budget unico); senza odss, o per i tornei che odss non ha, The Odds API.
        run: npm run raccolta-tennis
        continue-on-error: true
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          ODSS_API_KEY: ${{ secrets.ODSS_API_KEY }}
      - name: Raccolta basket
        # Quote da odss-api (1 richiesta per campionato con partite); senza odss, The Odds API.
        run: npm run raccolta-basket
        continue-on-error: true
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          ODSS_API_KEY: ${{ secrets.ODSS_API_KEY }}
      - name: Raccolta pallavolo
        # Quote da odss-api (1 richiesta se c'è un campionato attivo); senza odss, o senza partite su odss, OddsPapi.
        run: npm run raccolta-pallavolo
        continue-on-error: true
        env:
          ODDSPAPI_API_KEY: ${{ secrets.ODDSPAPI_API_KEY }}
          ODSS_API_KEY: ${{ secrets.ODSS_API_KEY }}
      - name: Registro della taratura
        # Esiti di tutti i mercati dei giorni passati (data/registro): dopo gli storici, che servono a basket e pallavolo.
        run: npm run registro
        continue-on-error: true
      - name: Salva i dati
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898799+github-actions[bot]@users.noreply.github.com"
          git add data/
          if [ -n "$(git status --porcelain data/)" ]; then
            git commit -m "Raccolta $(TZ=Europe/Rome date +%F)"
            # Fino a 3 tentativi: un push rifiutato (main avanzata nel frattempo) si riprova dopo una pausa.
            # Un conflitto nel rebase non si risolve da solo: si annulla e il job fallisce.
            salvato=
            for tentativo in 1 2 3; do
              if ! git pull --rebase; then
                git rebase --abort || true
                echo "Conflitto durante git pull --rebase: dati non salvati"
                exit 1
              fi
              if git push; then salvato=1; break; fi
              if [ "$tentativo" -lt 3 ]; then sleep 10; fi
            done
            if [ -z "$salvato" ]; then
              echo "git push rifiutato 3 volte: dati non salvati"
              exit 1
            fi
          fi
      - name: Avvia la pubblicazione del sito
        run: gh workflow run pubblica.yml
        env:
          GH_TOKEN: ${{ github.token }}
